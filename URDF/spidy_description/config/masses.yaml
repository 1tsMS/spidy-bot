# Spidy mass budget (grams). ESTIMATES until you weigh the real parts.
# Printed parts: Fusion volume x effective PLA density (solid PLA = 1.24 g/cm3;
# ~0.75 accounts for walls + ~20% infill). Replace with kitchen-scale numbers
# and re-run scripts/build_description.py.
pla_effective_density_g_cm3: 0.75

parts:
  base_link:   {printed: true}           # chassis plate
  TABLE:       {printed: true}           # battery deck
  shoulder:    {printed: true}           # coxa bracket (x4)
  elbow:       {printed: true}           # femur link (x4)
  claw:        {printed: true}           # tibia / foot (x4)
  servo:       {grams: 13.4}             # MG90S datasheet
  horn:        {grams: 1.0}
  Battery:     {grams: 190.0}            # 3S 2200 mAh LiPo, typical
  BUCK:        {grams: 55.0}             # 12A/300W buck module
  PCA:         {grams: 25.0}             # PCA9685 + power distribution board
  MCU_board:   {grams: 20.0}             # ESP32 + Mini360

# Wires, screws, XT60, switch. Lumped onto the chassis.
misc_on_base_g: 40.0
